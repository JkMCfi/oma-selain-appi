<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>Oma Moderni Selain</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f17;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Välilehtipalkki */
    .tab-bar {
      display: flex;
      background: #181825;
      padding: 6px 6px 0 6px;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid #313244;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #1e1e2e;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      max-width: 200px;
    }
    .tab.active {
      background: #313244;
      font-weight: bold;
    }
    .tab .close-tab {
      border-radius: 50%;
      width: 16px;
      height: 16px;
      text-align: center;
      line-height: 14px;
      font-size: 11px;
    }
    .tab .close-tab:hover { background: #585b70; }
    .new-tab-btn {
      padding: 4px 10px;
      background: transparent;
      border: none;
      color: #a6adc8;
      font-size: 18px;
      cursor: pointer;
    }
    .new-tab-btn:hover { color: white; }

    /* Navigointipalkki */
    .nav-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #181825;
      align-items: center;
    }
    button.nav-btn {
      padding: 6px 12px;
      background: #313244;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button.nav-btn:hover { background: #45475a; }
    input#url-bar {
      flex: 1;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #45475a;
      background: #11111b;
      color: #cdd6f4;
      font-size: 14px;
      outline: none;
    }
    input#url-bar:focus { border-color: #89b4fa; }

    /* Sisältöalue */
    .content-area {
      flex: 1;
      position: relative;
    }
    .view-pane {
      width: 100%;
      height: 100%;
      display: none;
      border: none;
      background: white;
    }
    .view-pane.active { display: block; }
  </style>
</head>
<body>

  <div class="tab-bar" id="tab-bar">
    <button class="new-tab-btn" id="new-tab-btn">+</button>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back-btn">←</button>
    <button class="nav-btn" id="forward-btn">→</button>
    <button class="nav-btn" id="reload-btn">↻</button>
    <button class="nav-btn" id="home-btn">🏠</button>
    <input type="text" id="url-bar" placeholder="Kirjoita osoite tai hae verkosta..." />
    <button class="nav-btn" id="go-btn">Hae</button>
  </div>

  <div class="content-area" id="content-area"></div>

  <script src="script.js"></script>
</body>
</html>

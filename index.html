<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oma Browser Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Välilehtipalkki */
    .tab-bar {
      display: flex;
      background: #11111b;
      padding: 6px 6px 0 6px;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid #313244;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #1e1e2e;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      min-width: 120px;
      max-width: 200px;
      border: 1px solid transparent;
      border-bottom: none;
    }
    .tab.active {
      background: #2a2a3c;
      color: #89b4fa;
      font-weight: 600;
      border-color: #313244;
    }
    .tab .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tab .close-tab {
      border-radius: 50%;
      width: 16px;
      height: 16px;
      text-align: center;
      line-height: 14px;
      font-size: 12px;
      color: #a6adc8;
    }
    .tab .close-tab:hover { background: #45475a; color: #fff; }
    .new-tab-btn {
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: #a6adc8;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    .new-tab-btn:hover { background: #313244; color: #fff; }

    /* Navigointipalkki */
    .nav-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #181825;
      align-items: center;
      border-bottom: 1px solid #313244;
    }
    button.nav-btn {
      padding: 6px 10px;
      background: #313244;
      color: #cdd6f4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button.nav-btn:hover { background: #45475a; color: #fff; }
    input#url-bar {
      flex: 1;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #45475a;
      background: #11111b;
      color: #cdd6f4;
      font-size: 14px;
      outline: none;
    }
    input#url-bar:focus { border-color: #89b4fa; }

    /* Kirjanmerkkipalkki */
    .bookmarks-bar {
      display: flex;
      gap: 10px;
      padding: 6px 12px;
      background: #181825;
      border-bottom: 1px solid #313244;
      font-size: 12px;
    }
    .bookmark-item {
      color: #a6adc8;
      cursor: pointer;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .bookmark-item:hover { background: #313244; color: #89b4fa; }

    /* Sisältöalue */
    .content-area {
      flex: 1;
      position: relative;
      background: #11111b;
    }
    .view-pane {
      width: 100%;
      height: 100%;
      display: none;
      border: none;
      background: white;
    }
    .view-pane.active { display: block; }
  </style>
</head>
<body>

  <div class="tab-bar" id="tab-bar">
    <button class="new-tab-btn" id="new-tab-btn" title="Uusi välilehti">+</button>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back-btn" title="Takaisin">←</button>
    <button class="nav-btn" id="forward-btn" title="Eteenpäin">→</button>
    <button class="nav-btn" id="reload-btn" title="Päivitä">↻</button>
    <button class="nav-btn" id="home-btn" title="Etusivu">🏠</button>
    <input type="text" id="url-bar" placeholder="Kirjoita hakusana tai verkkotunnus..." />
    <button class="nav-btn" id="go-btn">Hae</button>
    <button class="nav-btn" id="add-bookmark-btn" title="Tallenna kirjanmerkki">★</button>
  </div>

  <div class="bookmarks-bar" id="bookmarks-bar">
    <span class="bookmark-item" data-url="https://html.duckduckgo.com/html/">🔍 DuckDuckGo</span>
    <span class="bookmark-item" data-url="https://fi.wikipedia.org">📚 Wikipedia</span>
    <span class="bookmark-item" data-url="https://example.com">🌐 Example</span>
  </div>

  <div class="content-area" id="content-area"></div>

  <script src="script.js"></script>
</body>
</html>

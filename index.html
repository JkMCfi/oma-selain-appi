<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatBrowser 🐱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #11111b;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Välilehtipalkki */
    .tab-bar {
      display: flex;
      background: #181825;
      padding: 6px 6px 0 6px;
      gap: 4px;
      align-items: center;
      border-bottom: 1px solid #313244;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #1e1e2e;
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      min-width: 130px;
      max-width: 200px;
      border: 1px solid transparent;
      border-bottom: none;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: #313244;
      color: #f5c2e7;
      font-weight: 600;
      border-color: #45475a;
    }
    .tab .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .tab .close-tab {
      border-radius: 50%;
      width: 18px;
      height: 18px;
      text-align: center;
      line-height: 16px;
      font-size: 12px;
      color: #a6adc8;
    }
    .tab .close-tab:hover { background: #f38ba8; color: #11111b; }
    .new-tab-btn {
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: #a6adc8;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
    }
    .new-tab-btn:hover { background: #313244; color: #fff; }

    /* Navigointipalkki */
    .nav-bar {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: #181825;
      align-items: center;
      border-bottom: 1px solid #313244;
    }
    button.nav-btn {
      padding: 6px 12px;
      background: #313244;
      color: #cdd6f4;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button.nav-btn:hover { background: #45475a; color: #fff; }
    input#url-bar {
      flex: 1;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #45475a;
      background: #11111b;
      color: #f5c2e7;
      font-size: 14px;
      outline: none;
    }
    input#url-bar:focus { border-color: #cba6f7; }

    /* Kirjanmerkit */
    .bookmarks-bar {
      display: flex;
      gap: 10px;
      padding: 6px 12px;
      background: #1e1e2e;
      border-bottom: 1px solid #313244;
      font-size: 12px;
    }
    .bookmark-item {
      color: #a6adc8;
      cursor: pointer;
      text-decoration: none;
      padding: 2px 8px;
      border-radius: 4px;
      background: #181825;
    }
    .bookmark-item:hover { background: #313244; color: #f5c2e7; }

    /* Sisältöalue */
    .content-area {
      flex: 1;
      position: relative;
      background: #11111b;
    }
    .view-pane {
      width: 100%;
      height: 100%;
      display: none;
      border: none;
    }
    .view-pane.active { display: block; }
    iframe.view-pane { background: white; }

    /* Custom CatPages */
    .custom-page {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .custom-page.active { display: flex; }
    .brand-title { font-size: 42px; font-weight: bold; margin-bottom: 8px; color: #cba6f7; text-align: center; }
    .sub-title { color: #a6adc8; margin-bottom: 30px; font-size: 15px; text-align: center; }

    .search-box-home {
      display: flex;
      width: 100%;
      max-width: 600px;
      gap: 10px;
      margin-bottom: 30px;
    }
    .search-box-home input {
      flex: 1;
      padding: 14px 22px;
      border-radius: 30px;
      border: 1px solid #45475a;
      background: #11111b;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .search-box-home input:focus { border-color: #cba6f7; }
    .search-box-home button {
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      background: #cba6f7;
      color: #11111b;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    .search-box-home button:hover { background: #f5c2e7; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 750px;
    }
    .app-card {
      background: #313244;
      padding: 22px 15px;
      border-radius: 16px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease-in-out;
      border: 1px solid #45475a;
    }
    .app-card:hover { transform: translateY(-5px); background: #45475a; border-color: #cba6f7; }
    .app-icon { font-size: 36px; margin-bottom: 10px; }
    .app-name { font-size: 14px; font-weight: 600; color: #cdd6f4; }

    .search-results-area {
      width: 100%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .result-card {
      background: #313244;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #45475a;
    }
    .result-title { font-size: 18px; font-weight: bold; color: #89b4fa; margin-bottom: 6px; cursor: pointer; }
    .result-title:hover { text-decoration: underline; }
    .result-snippet { font-size: 14px; color: #a6adc8; }
  </style>
</head>
<body>

  <div class="tab-bar" id="tab-bar">
    <button class="new-tab-btn" id="new-tab-btn" title="Uusi välilehti">+</button>
  </div>

  <div class="nav-bar">
    <button class="nav-btn" id="back-btn" title="Takaisin">←</button>
    <button class="nav-btn" id="forward-btn" title="Eteenpäin">→</button>
    <button class="nav-btn" id="reload-btn" title="Päivitä">↻</button>
    <button class="nav-btn" id="home-btn" title="Etusivu">🏠</button>
    <input type="text" id="url-bar" placeholder="Kirjoita osoite tai hae CatBrowserilla..." />
    <button class="nav-btn" id="go-btn">Hae</button>
  </div>

  <div class="bookmarks-bar" id="bookmarks-bar">
    <span class="bookmark-item" data-url="catbrowser://apps">📱 Cat Apps</span>
    <span class="bookmark-item" data-url="catbrowser://search">🔍 CatSearch</span>
    <span class="bookmark-item" data-url="https://fi.wikipedia.org">📚 Wikipedia</span>
    <span class="bookmark-item" data-url="https://example.com">🌐 Example</span>
  </div>

  <div class="content-area" id="content-area"></div>

  <script src="script.js"></script>
</body>
</html>
